name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: git ls-files '*.cpp' '*.hpp' '*.cu' '*.cuh' | xargs uvx clang-format@23.1.3 --dry-run --Werror
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.1 check
