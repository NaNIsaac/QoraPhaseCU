name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/wheels.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
