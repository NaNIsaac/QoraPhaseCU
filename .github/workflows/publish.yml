name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Builds and scans the release files without an upload, to check them off a tag.
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/wheels.yml

  # The files wheels.yml built, checked for secrets, credential file names and home-folder
  # paths; cibuildwheel builds them, so the gates only scan (leak-only)
  gates:
    needs: build
    uses: NaNIsaac/.github/.github/workflows/publish-gates.yml@3c147080c0d6968e7ec3fa6e5a848f5ae7bce7c8
    permissions:
      contents: read
    with:
      leak-only-artifacts: dist-*
      # GitHub runner home that delvewheel records in the Windows wheel (DELVEWHEEL)
      path-allowlist: |
        C:\Users\runneradmin

  publish:
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
      # The same artifacts the gates checked
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
