[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "qoraphasecu"
version = "0.1.0"
description = "C++/CUDA phase retrieval for coherent diffraction imaging, with the algorithms of QoraPhase"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.12"
keywords = ["phase retrieval", "coherent diffraction imaging", "CDI", "cuda", "x-ray imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=2"]

[project.urls]
Homepage = "https://github.com/NaNIsaac/QoraPhaseCU"
Repository = "https://github.com/NaNIsaac/QoraPhaseCU"
Issues = "https://github.com/NaNIsaac/QoraPhaseCU/issues"
Changelog = "https://github.com/NaNIsaac/QoraPhaseCU/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]
# The QoraPhase release the interop and parity tests run against.
qoraphase = ["qoraphase==0.1.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/qoraphasecu"]
wheel.py-api = "cp312"
sdist.exclude = [".github", "build", "docs", "bench", "examples"]

[tool.scikit-build.cmake.define]
QORAPHASECU_PYTHON = "ON"
QORAPHASECU_TESTS = "OFF"
QORAPHASECU_BENCH = "OFF"
QORAPHASECU_EXAMPLES = "OFF"

# CPU backend only; a CUDA wheel would have to ship or locate cuFFT.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
test-groups = ["dev"]
test-sources = ["python/tests"]
test-command = "pytest -q python/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Apple Clang ships no OpenMP runtime, and Homebrew's libomp is built for the
# runner's macOS (26), which bundling would make the wheel's minimum. Without
# OpenMP only the CPU reference's element-wise loops lose their threads.
[tool.cibuildwheel.macos]
archs = ["arm64"]
config-settings = { "cmake.define.QORAPHASECU_OPENMP" = "OFF" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF"]
